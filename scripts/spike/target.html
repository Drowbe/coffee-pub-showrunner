<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#123}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// A page that changes every frame and says, in black and white blocks, when it drew each frame:
// row 0 = time in ms (32 bits), row 1 = frame counter (32 bits), row 2 = time inverted (a check).
// A magenta block at 0,0 shows where the page starts inside a captured window.
const c = document.getElementById('c'); const g = c.getContext('2d', { alpha: false });
const CELL = 24; const OX = 100; const OY = 100;
let n = 0; window.drawn = 0; // read by the test to see how fast the page itself is drawing
function size() { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; c.style.width = `${innerWidth}px`; c.style.height = `${innerHeight}px`; }
addEventListener('resize', size); size();
function row(y, value) { for (let i = 0; i < 32; i += 1) { g.fillStyle = (value >>> (31 - i)) & 1 ? '#fff' : '#000'; g.fillRect(OX + i * CELL, y, CELL, CELL); } }
function draw() {
  n += 1; window.drawn = n;
  g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  g.fillStyle = '#123'; g.fillRect(0, 0, innerWidth, innerHeight);
  for (let i = 0; i < 40; i += 1) { g.fillStyle = `hsl(${(n * 3 + i * 9) % 360} 70% 45%)`; g.fillRect(((n * 7 + i * 97) % (innerWidth + 120)) - 120, 220 + ((i * 53) % Math.max(1, innerHeight - 300)), 120, 40); }
  g.fillStyle = '#f0f'; g.fillRect(0, 0, 40, 40);
  const t = Math.round(performance.timeOrigin + performance.now()) % 4294967296;
  row(OY, t); row(OY + CELL, n); row(OY + CELL * 2, (~t) >>> 0);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>

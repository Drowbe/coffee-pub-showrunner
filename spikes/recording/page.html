<!doctype html>
<meta charset="utf-8">
<title>spike source</title>
<style>html,body{margin:0;background:#101820;color:#fff;font:28px system-ui;overflow:hidden}#flash{position:absolute;left:0;top:0;width:100px;height:100px;background:#000}#t{position:absolute;left:130px;top:20px}</style>
<div id="flash"></div><div id="t"></div><canvas id="c" width="1280" height="720" style="position:absolute;left:0;top:140px"></canvas>
<script>
// A stand-in for a busy page: lots of moving shapes, a clock, and (optionally) a beep once a second that coincides with the white flash.
const q = new URLSearchParams(location.search);
const heavy = Number(q.get('heavy') || 400);
const beep = q.get('beep') === '1';
const c = document.getElementById('c'), g = c.getContext('2d'), flash = document.getElementById('flash'), t = document.getElementById('t');
const shapes = Array.from({ length: heavy }, (_, i) => ({ x: Math.random() * 1280, y: Math.random() * 580, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8, s: 10 + Math.random() * 40, h: i * 7 % 360 }));
const webgl = q.get('webgl') === '1';
let ctx = null;
const media = q.get('media') || 'webaudio'; // webaudio | element (an <audio> playing a file) | webrtc (audio arriving over a peer connection)
let mediaEl = null, rtcDest = null;
function wavBlob(seconds) { // a 880 Hz beep at the start of every second
  const rate = 48000, n = rate * seconds, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i += 1) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i += 1) { const t = (i % rate) / rate; v.setInt16(44 + i * 2, t < 0.1 ? Math.sin(2 * Math.PI * 880 * t) * 0.5 * 32767 : 0, true); }
  return new Blob([buf], { type: 'audio/wav' });
}
async function setupMedia() {
  if (media === 'element') { mediaEl = document.createElement('audio'); mediaEl.src = URL.createObjectURL(wavBlob(700)); document.body.appendChild(mediaEl); }
  if (media === 'webrtc') {
    ctx = new AudioContext(); rtcDest = ctx.createMediaStreamDestination();
    const a = new RTCPeerConnection(), b = new RTCPeerConnection();
    a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate); b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate);
    b.ontrack = (e) => { if (!q.get('noanalyser')) { const ac2 = new AudioContext(); const an = ac2.createAnalyser(); an.fftSize = 1024; ac2.createMediaStreamSource(e.streams[0]).connect(an); const buf = new Float32Array(1024); let loud = false, n = 0; setInterval(() => { an.getFloatTimeDomainData(buf); let s = 0; for (const x of buf) s += x * x; const on = Math.sqrt(s / 1024) > 0.05; if (on && !loud) { n += 1; document.title = 'received ' + n + ' pings ' + (window.__pings || 0); } loud = on; }, 5); } mediaEl = document.createElement('audio'); mediaEl.srcObject = e.streams[0]; document.body.appendChild(mediaEl); mediaEl.play().catch((err) => console.log('play failed', err)); };
    rtcDest.stream.getTracks().forEach((t) => a.addTrack(t, rtcDest.stream));
    await a.setLocalDescription(await a.createOffer()); await b.setRemoteDescription(a.localDescription);
    await b.setLocalDescription(await b.createAnswer()); await a.setRemoteDescription(b.localDescription);
  }
}
setupMedia();
let steady = null;
function ping() {
  if (media === 'webrtc' && q.get('steady')) { if (!steady) { steady = ctx.createOscillator(); const gn = ctx.createGain(); gn.gain.value = 0.5; steady.connect(gn); gn.connect(rtcDest); steady.start(); } return; }
  window.__pings = (window.__pings || 0) + 1;
  if (media === 'element') { if (mediaEl && mediaEl.paused) mediaEl.play().catch(() => {}); return; }
  if (!ctx) ctx = new AudioContext();
  const o = ctx.createOscillator(), gain = ctx.createGain();
  o.frequency.value = 880; gain.gain.value = 0.5;
  o.connect(gain); gain.connect(media === 'webrtc' ? rtcDest : ctx.destination);
  o.start(); o.stop(ctx.currentTime + (media === 'webrtc' ? 0.4 : 0.1));
}
let glr = null;
function initGl() {
  const cv = document.createElement('canvas'); cv.width = 1280; cv.height = 580; cv.style.cssText = 'position:absolute;left:0;top:140px';
  document.body.appendChild(cv);
  const gl = cv.getContext('webgl');
  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs = 'precision mediump float;uniform float t;void main(){vec2 u=gl_FragCoord.xy/vec2(1280.,580.);float v=0.;for(int i=0;i<40;i++){float f=float(i);v+=sin(u.x*(8.+f)+t*(1.+f*.1))*cos(u.y*(6.+f)-t*.7);}gl_FragColor=vec4(.5+.5*sin(v),.5+.5*cos(v*1.3),.5+.5*sin(v*.7),1.);}';
  const mk = (type, src) => { const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); return sh; };
  const pr = gl.createProgram(); gl.attachShader(pr, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  glr = (now) => { gl.uniform1f(gl.getUniformLocation(pr, 't'), now / 1000); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
}
if (webgl) initGl();
function frame(now) {
  if (glr) glr(now);
  if (!webgl) { g.fillStyle = '#16212d'; g.fillRect(0, 0, 1280, 720); } else g.clearRect(0, 0, 1280, 720);
  if (!webgl) for (const s of shapes) {
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0 || s.x > 1280 - s.s) s.vx *= -1;
    if (s.y < 0 || s.y > 580 - s.s) s.vy *= -1;
    g.fillStyle = `hsl(${(s.h + now / 20) % 360} 70% 55%)`; g.fillRect(s.x, s.y, s.s, s.s);
  }
  t.textContent = (now / 1000).toFixed(2) + ' s';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// The flash and the beep start together once a second, from a timer.
let n = 0;
setInterval(() => {
  n += 1;
  flash.style.background = '#fff';
  setTimeout(() => { flash.style.background = '#000'; }, 150);
  if (beep) ping();
}, 1000);
</script>

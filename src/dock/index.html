<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Coffee Pub Dock</title>
  <link rel="stylesheet" href="dock.css">
</head>
<body>
  <div class="pill" id="pill">
    <div class="strip" id="strip">
      <img class="cup" src="../assets/mark-color.png" alt="" title="Coffee Pub Showrunner">
      <span class="dots" id="dots"></span>
      <span class="rec-dot" id="rec-dot" title="Recording" hidden></span>
      <span class="live-dot" id="live-dot" title="Streaming" hidden></span>
    </div>
    <div class="panel" id="panel">
      <header class="panel-head">
        <span class="title">Coffee Pub</span>
        <span class="obs-state" id="obs-state">OBS offline</span>
      </header>
      <div class="live-row" id="live-row">
        <span class="pillet rec" id="rec" hidden>REC <b id="rec-time"></b></span>
        <span class="pillet live" id="live" hidden>LIVE <b id="live-time"></b></span>
        <span class="scene" id="scene"></span>
      </div>
      <div class="primary">
        <button class="primary-btn" data-action="recToggle" type="button" id="rec-toggle"><span class="rec-glyph" aria-hidden="true"></span><span id="rec-toggle-label">Start recording</span></button>
        <button class="tool more" type="button" id="rec-more" title="More recording options" aria-label="More recording options" aria-haspopup="menu">&hellip;</button>
      </div>
      <div class="cards" id="cards"></div>
      <div class="tools">
        <button class="tool" type="button" id="menu-windows" aria-haspopup="menu">Windows &#9662;</button>
        <button class="tool" type="button" id="menu-obs" aria-haspopup="menu" hidden>OBS &#9662;</button>
        <button class="tool" data-action="panel" type="button">Control panel</button>
      </div>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
  </div>
  <script src="dock.js"></script>
</body>
</html>

name: Build desktop app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag, e.g. v1.0.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build universal dmg
    runs-on: macos-latest
    env:
      HAS_APPLE_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Write notarization API key
        if: ${{ env.HAS_APPLE_KEY == 'true' }}
        run: echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      # Signs + notarizes when the Apple secrets exist; otherwise builds unsigned.
      - name: Build app
        run: npm run build-info && npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Coffee-Pub-Showrunner-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Coffee Pub Showrunner ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.dmg

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build app (unsigned)
        if: ${{ env.AZURE_TENANT_ID == '' }}
        run: npm run build-info && npx electron-builder --win --publish never

      # Azure Trusted Signing: set the secrets + vars below to enable.
      - name: Build app (signed)
        if: ${{ env.AZURE_TENANT_ID != '' }}
        run: >
          npm run build-info && npx electron-builder --win --publish never
          -c.win.azureSignOptions.endpoint=${{ vars.AZURE_SIGN_ENDPOINT }}
          -c.win.azureSignOptions.codeSigningAccountName=${{ vars.AZURE_SIGN_ACCOUNT }}
          -c.win.azureSignOptions.certificateProfileName=${{ vars.AZURE_SIGN_PROFILE }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Coffee-Pub-Showrunner-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Coffee Pub Showrunner ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.exe
